name: Frontend CI

on:
    push:
        branches:
            - main
        paths:
            - 'frontend/**'

    pull_request:
        branches:
            - main
        paths:
            - 'frontend/**'

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout frontend code
              uses: actions/checkout@v4
            
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with: 
                node-version: 20
                cache: 'npm'
                cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              working-directory: frontend
              run: npm ci
            
            - name: Build frontend
              working-directory: frontend
              run: npm run build
            
            - name: Upload frontend build
              uses: actions/upload-artifact@v4
              with:
                name: frontend-build
                path: frontend/dist

            - name: Start frontend
              working-directory: frontend
              run: nohup npm run preview -- --host 0.0.0.0 > frontend.log 2>&1 &

            - name: Check frontend
              run: |
               sleep 5
               curl --fail http://localhost:4173
              