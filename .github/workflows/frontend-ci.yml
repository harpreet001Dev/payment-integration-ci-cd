name: Frontend CI

on:
    push:
        branches:
            - main
        paths:
            - 'frontend/**'

    pull_request:
        branches:
            - main
        paths:
            - 'frontend/**'

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout frontend code
              uses: actions/checkout@v4
            
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with: 
                node-version: 20

            - name: Install dependencies
              working-directory: frontend
              run: npm ci
            
            - name: Build frontend
              working-directory: frontend
              run: npm run build
              